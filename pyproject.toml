[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-downloader"
version = "0.1.0"
description = "Download, verify, cache, and query Binance historical data"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5,<2",
    "httpx>=0.28,<1",
    "pandas>=3,<4",
    "pyarrow>=25,<26",
    "rich>=15,<16",
]

[project.optional-dependencies]
dev = [
    "black>=26,<27",
    "mypy>=1,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "radon>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
target-version = ["py314"]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=crypto_downloader",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["crypto_downloader"]
